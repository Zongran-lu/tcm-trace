<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人参 · 中药鉴定溯源</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4efe9 100%);
            color: #333;
            line-height: 1.6;
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        header {
            background: #1a5f4a;
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
        }
        header h1 { font-size: 1.4rem; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 16px;
        }
        .info-item {
            margin: 12px 0;
            padding: 10px 14px;
            background: #f8fbf9;
            border-radius: 8px;
            border-left: 4px solid #1a5f4a;
        }
        .label { font-weight: 600; color: #1a5f4a; display: block; margin-bottom: 4px; }
        .badge {
            display: inline-block;
            background: #2e7d32;
            color: white;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            margin-top: 8px;
        }
        .hash {
            font-family: monospace;
            font-size: 0.75rem;
            word-break: break-all;
            background: #eee;
            padding: 8px;
            border-radius: 4px;
            margin-top: 8px;
        }
        a.back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1a5f4a;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <header>
        <h1>人参 · 中药鉴定</h1>
        <p>第一部分 · 区块链溯源</p>
    </header>

    <div class="card">
        <div class="info-item">
            <span class="label">产地</span>
            吉林省靖宇县
        </div>
        <div class="info-item">
            <span class="label">公司</span>
            河北明珠药业有限公司
        </div>
        <div class="info-item">
            <span class="label">批号</span>
            26070702
        </div>
        <div class="info-item">
            <span class="label">显微特征</span>
            树脂道、草酸钙簇晶、网纹导管、梯纹导管
        </div>
        <span class="badge">数据已上链 · 不可篡改</span>
        <div class="hash" id="hash">计算中...</div>
    </div>

    <a class="back" href="../index.html">← 返回全流程总览</a>

    <script>
        async function computeHash() {
            const data = "人参|吉林省靖宇县|河北明珠药业有限公司|26070702|树脂道、草酸钙簇晶、网纹导管、梯纹导管";
            const encoder = new TextEncoder();
            const dataBuffer = encoder.encode(data);
            const hashBuffer = await crypto.subtle.digest('SHA-256', dataBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            document.getElementById('hash').textContent = "SHA-256: " + hashHex;
        }
        computeHash();
    </script>
</body>
</html>
